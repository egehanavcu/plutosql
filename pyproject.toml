[project]
name = "plutosql"
version = "0.1.0"
description = "PL/SQL yeniden yazım konfigürasyonlarının çok kriterli (Consistent Gets / ΔPGA) optimizasyonu"
requires-python = ">=3.11"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "oracledb>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "antlr4-tools>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plutosql*"]

[tool.setuptools.package-data]
"plutosql.transformer" = ["grammar/*.g4"]
"plutosql.db" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["oracle: canlı Oracle veritabanı gerektirir (erişilemezse atlanır)"]
