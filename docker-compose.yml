# Oracle Database Free (23ai) — ölçüm ortamı.
#   docker compose up -d          # ilk açılışta veritabanı oluşturulur (birkaç dakika)
#   docker compose ps             # STATUS "healthy" olunca hazır
#   python -m plutosql.db setup   # şema + sentetik veri
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: plutosql-oracle
    ports:
      - "${PLUTO_PORT:-1522}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?.env dosyası eksik}
      PLUTO_USER: ${PLUTO_USER:-pluto}
      PLUTO_PASSWORD: ${PLUTO_PASSWORD:?.env dosyası eksik}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/initdb:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  oracle-data:
